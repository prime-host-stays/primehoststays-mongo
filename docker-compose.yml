# primehoststays-mongo — shared MongoDB backing service for the Prime Host
# Stays project on the shared phs.rest (dev) target. Single-container backing
# service by design (see AGENTS.md/README); contains no application code.
#
# CANONICAL MANIFEST. The platform deployer consumes docker-compose.yml
# directly (same convention as primehoststays.com-api and
# primehoststays-admin-api). compose.yml in this repository used to be a
# byte-for-byte duplicate of the old manifest; it now carries the same
# content as this file so no loader can pick up a stale version, and must be
# deleted (`git rm compose.yml`) once the duplicate is confirmed gone.
#
# Port mapping: no service publishes a host port. On the shared
# shared_deployment_server target, host ports are allocated by the
# shared-ingress lifecycle; an ephemeral `published: "0"` publish cannot be
# matched against an allocation, so deployment_apply_v2 rejects the plan
# with deployment_port_binding_invalid before any container is recreated.
# The platform still needs each service's container port: it is declared
# explicitly with `expose` (mongo: "27017", mongo-http-probe: "8080") so the
# inspector does not guess it from image metadata, and the probe's health
# path `/` on 8080 is reached over the bridge network, not a host port. Not
# publishing anything satisfies AGENTS.md ("do not publish the database
# port to anything other than loopback") trivially. API containers never
# use host ports: they reach Mongo over the phs-rest-dev bridge network via
# the pinned container_name `primehoststays-mongo` on 27017.
#
# Health: mongod 8 has no native HTTP endpoint, so the mongo service keeps
# the canonical mongosh-ping readiness probe, and a separate nginx-based
# `mongo-http-probe` service exposes the HTTP 200 path the platform's
# verification can hit (see services.mongo-http-probe).
#
# Secrets: the seven credential env keys are declared in the top-level
# `secrets:` block as external secrets; the deployment platform binds their
# values from the repository-scoped secret store (repo githubId 1379970668,
# name primehoststays-mongo) and injects them into the container environment
# at deploy time under exactly these key names. Compose performs no ${VAR}
# substitution for credentials and does not source them from the repository
# .env. The mongo image entrypoint consumes MONGO_INITDB_* natively, and
# docker-entrypoint-initdb.d/001-init-phs.js reads the PHS_* keys via
# process.env on first boot.

name: primehoststays-mongo

services:
  mongo:
    image: mongo:8.3.11-noble
    container_name: primehoststays-mongo
    restart: unless-stopped
    # No `ports:` block: on the shared target, host ports are allocated by
    # the shared-ingress lifecycle, and an ephemeral `published: "0"`
    # publish cannot be matched against an allocation
    # (deployment_port_binding_invalid). `expose` declares the container
    # port for the platform inspector without any host-port allocation;
    # inter-service traffic reaches Mongo as `primehoststays-mongo:27017`
    # over phs-rest-dev, not a host port.
    expose:
      - "27017"
    volumes:
      - phs-mongo-data:/data/db
      - ./docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d:ro
    networks:
      - phs-rest-dev
    # First-run MongoDB init (entrypoint scripts, user creation, binding 27017)
    # can exceed 30s on the shared dev target, so the activation health gate
    # needs more headroom: start_period 60s and 10 retries give the container
    # room to finish init before the gate is evaluated.
    healthcheck:
      # CLI readiness probe: mongod 8 exposes no HTTP endpoint, so mongosh
      # ping remains the canonical readiness signal for this image. The
      # HTTP-reachable path the platform verifies lives on the
      # mongo-http-probe service below, which is gated on this healthcheck.
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok' || exit 1"]
      interval: 20s
      timeout: 15s
      start_period: 60s
      retries: 10
    # Reference the external, platform-bound secrets; the platform injects
    # their values as container environment variables named exactly like
    # these keys (repo githubId 1379970668, name primehoststays-mongo).
    secrets:
      - MONGO_INITDB_ROOT_USERNAME
      - MONGO_INITDB_ROOT_PASSWORD
      - MONGO_INITDB_DATABASE
      - PHS_COM_API_USERNAME
      - PHS_COM_API_PASSWORD
      - PHS_ADMIN_API_USERNAME
      - PHS_ADMIN_API_PASSWORD

  mongo-http-probe:
    # Minimal HTTP liveness surface for the shared target's verification.
    # mongod 8 exposes no HTTP endpoint, so the platform cannot probe the
    # database port over HTTP; this static responder answers HTTP 200 with a
    # small JSON body on EVERY path (/, /healthz, /livez, ...), so the
    # verification works regardless of which path the platform requests.
    #
    # Startup is gated on Mongo health: depends_on condition: service_healthy
    # means the probe only starts after the mongo service passes its
    # mongosh-ping healthcheck. Known limitation: once running, this static
    # responder keeps answering 200 even if Mongo later dies; Mongo liveness
    # remains governed by the mongo service's own healthcheck and restart
    # policy. The probe is deliberately credential-free (no Mongo admin UI,
    # no credentials mounted) and is reachable only over the phs-rest-dev
    # bridge network — no host port is published.
    image: nginx:1.27-alpine
    container_name: primehoststays-mongo-http-probe
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    # No `ports:` block (see header): the platform's healthcheck path (`/` on
    # container port 8080) is reached over the phs-rest-dev bridge network
    # via container_name `primehoststays-mongo-http-probe`; `expose` declares
    # the container port for the platform inspector without any host-port
    # allocation.
    expose:
      - "8080"
    volumes:
      - ./probe/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - phs-rest-dev
    healthcheck:
      # busybox wget is present in the alpine base image; curl is not.
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:8080/ >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5

networks:
  phs-rest-dev:
    name: phs-rest-dev
    driver: bridge
    # Created by the deployer on the shared target; compose will not create it.
    external: true

volumes:
  phs-mongo-data:
    # Pinned to the platform-managed named volume on the shared target:
    # external with an explicit name so compose attaches the existing volume
    # instead of creating a project-prefixed one.
    external: true
    name: phs-mongo-data

secrets:
  # External secrets bound by the deployment platform to this repository
  # (githubId 1379970668, name primehoststays-mongo). The entry names are
  # exactly the seven required credential env keys; the platform resolves
  # their values per repository and injects them into the mongo container
  # environment at deploy time. No values come from the repo .env, and no
  # ${VAR} substitution is used for credentials.
  MONGO_INITDB_ROOT_USERNAME:
    external: true
  MONGO_INITDB_ROOT_PASSWORD:
    external: true
  MONGO_INITDB_DATABASE:
    external: true
  PHS_COM_API_USERNAME:
    external: true
  PHS_COM_API_PASSWORD:
    external: true
  PHS_ADMIN_API_USERNAME:
    external: true
  PHS_ADMIN_API_PASSWORD:
    external: true
