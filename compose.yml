# DEPRECATED DUPLICATE — pending deletion.
#
# This file previously duplicated the old docker-compose.yml byte-for-byte.
# The canonical manifest for the platform deployer is docker-compose.yml
# (the deployer consumes docker-compose.yml directly, matching
# primehoststays.com-api and primehoststays-admin-api). The functional
# content below is identical to docker-compose.yml so that no loader
# (compose auto-discovery prefers compose.yml over docker-compose.yml) picks
# up a stale manifest in the interim.
#
# Credentials: see docker-compose.yml header. The six credential keys are
# passed on the mongo service `environment:` block with required
# `${VAR:?error}` interpolation; there is no compose `secrets:` block (the
# platform's rootless Compose rejects `external: true` secrets) and the
# repository .env is never sourced for credentials. Values are bound per
# repository by the deployment platform (githubId 1379970668, name
# primehoststays-mongo) and injected into the container environment.
# MONGO_INITDB_DATABASE is deliberately not bound: the platform binds no value
# for that key and docker-entrypoint-initdb.d/001-init-phs.js targets the
# `phs` database explicitly, so requiring it only aborts the deployment plan.
#
# DELETE THIS FILE: `git rm compose.yml`.

name: primehoststays-mongo

services:
  mongo:
    # Pinned to mongo:8.3.11-noble (current MongoDB 8.3 stable, includes
    # SERVER-125742 "Remove the graceful exit for kernel version 7.0.14 and
    # above" carried from 8.3.9). The previous 8.0.32 pin triggered the
    # upstream TCMalloc/rseq graceful-exit on the shared dev target's kernel
    # and refused to start; 8.3.x is the supported bump target until the
    # platform host kernel reaches 7.0.14+ or MongoDB vendors the fixed
    # TCMalloc upstream of the workaround. Bump again on the next MongoDB
    # 8.3 patch release that carries additional CVEs.
    image: mongo:8.3.11-noble
    container_name: primehoststays-mongo
    restart: unless-stopped
    # No `ports:` block (see docker-compose.yml header): on the shared
    # `phs.rest` (dev) target, host ports are allocated by the shared-ingress
    # lifecycle, and an ephemeral `published: "0"` publish cannot be matched
    # against an allocation. `expose` declares the container port for the
    # platform inspector without any host-port allocation.
    expose:
      - "27017"
    volumes:
      - phs-mongo-data:/data/db
      - ./docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d:ro
    networks:
      - phs-rest-dev
    # Platform-bound credentials for this repository (githubId 1379970668,
    # name primehoststays-mongo). The platform injects these six values as
    # container environment variables named exactly like the keys, so they
    # are passed straight through the service `environment:` block. Required
    # `${VAR:?error}` interpolation fails fast at compose-parse time if the
    # deployer does not supply any one of them. The mongo image entrypoint
    # consumes the MONGO_INITDB_ROOT_* keys natively, and
    # docker-entrypoint-initdb.d/001-init-phs.js reads the PHS_* keys via
    # process.env on first boot. MONGO_INITDB_DATABASE is not bound here: the
    # init script hardcodes db.getSiblingDB('phs') and no platform binding
    # exists for that key, so requiring it would abort the deployment plan.
    environment:
      MONGO_INITDB_ROOT_USERNAME: "${MONGO_INITDB_ROOT_USERNAME:?MONGO_INITDB_ROOT_USERNAME is required}"
      MONGO_INITDB_ROOT_PASSWORD: "${MONGO_INITDB_ROOT_PASSWORD:?MONGO_INITDB_ROOT_PASSWORD is required}"
      PHS_COM_API_USERNAME: "${PHS_COM_API_USERNAME:?PHS_COM_API_USERNAME is required}"
      PHS_COM_API_PASSWORD: "${PHS_COM_API_PASSWORD:?PHS_COM_API_PASSWORD is required}"
      PHS_ADMIN_API_USERNAME: "${PHS_ADMIN_API_USERNAME:?PHS_ADMIN_API_USERNAME is required}"
      PHS_ADMIN_API_PASSWORD: "${PHS_ADMIN_API_PASSWORD:?PHS_ADMIN_API_PASSWORD is required}"
    # First-run MongoDB init (entrypoint scripts, user creation, binding 27017)
    # can exceed 30s on the shared dev target, so the activation health gate
    # needs more headroom: start_period 60s and 10 retries give the container
    # room to finish init before the gate is evaluated.
    healthcheck:
      # CLI readiness probe: mongod 8 exposes no HTTP endpoint, so mongosh
      # ping remains the canonical readiness signal for this image. The
      # HTTP-reachable path the platform verifies lives on the
      # mongo-http-probe service below, which is gated on this healthcheck.
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok' || exit 1"]
      interval: 20s
      timeout: 15s
      start_period: 60s
      retries: 10

  mongo-http-probe:
    # Minimal HTTP liveness surface for the shared target's verification:
    # every path answers HTTP 200; startup gated on mongo service_healthy.
    # See docker-compose.yml for the full rationale. Deliberately
    # credential-free: no `environment:` block, no credentials mounted.
    image: nginx:1.27-alpine
    container_name: primehoststays-mongo-http-probe
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    # No `ports:` block (see docker-compose.yml header): the platform's
    # healthcheck path (`/` on container port 8080) is reached over the
    # phs-rest-dev bridge network via container_name
    # `primehoststays-mongo-http-probe`; `expose` declares the container
    # port for the platform inspector without any host-port allocation.
    expose:
      - "8080"
    volumes:
      - ./probe/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - phs-rest-dev
    healthcheck:
      # busybox wget is present in the alpine base image; curl is not.
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:8080/ >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5

networks:
  phs-rest-dev:
    name: phs-rest-dev
    driver: bridge
    # Created by the deployer on the shared target; compose will not create it.
    external: true

volumes:
  phs-mongo-data:
    # Pinned to the platform-managed named volume on the shared target.
    external: true
    name: phs-mongo-data
