# HTTP liveness surface for primehoststays-mongo on the shared phs.rest (dev)
# target. mongod 8 exposes no HTTP endpoint, so the deployment platform's
# HTTP verification probes this static responder instead of the database
# port. Every path answers HTTP 200 so the platform can request /, /healthz,
# or any other path it uses for verification.
#
# Mongo health is gated upstream: the mongo-http-probe container starts only
# after the mongo service passes its mongosh-ping healthcheck
# (depends_on: condition: service_healthy), and Mongo's own healthcheck plus
# restart policy remain the authority for ongoing Mongo liveness. This
# responder serves nothing but the static JSON body below and is published
# loopback-only by the compose manifest.
server {
    listen 8080;
    server_name _;
    default_type application/json;

    location / {
        return 200 '{"service":"primehoststays-mongo","status":"ok"}';
    }
}